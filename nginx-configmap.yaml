apiVersion: v1
kind: ConfigMap
metadata:
  name: calculadora-nginx
  namespace: practice-3
  labels:
    app.kubernetes.io/name: calculadora-frontend
data:
  default.conf.template: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

      set $backend_host "${API_HOST}";
      set $backend_port "${API_PORT}";

      location /api/ {
        proxy_pass http://$backend_host:$backend_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /health {
        proxy_pass http://$backend_host:$backend_port/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
